global:
  environment: production
  imageRegistry: 123456789012.dkr.ecr.us-east-1.amazonaws.com

orderService:
  image:
    repository: shopflow-order-service
    tag: latest
  replicas: 3
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

authService:
  image:
    repository: shopflow-auth-service
    tag: latest
  replicas: 2

apiGateway:
  image:
    repository: shopflow-api-gateway
    tag: latest
  replicas: 2
  service:
    type: LoadBalancer
    port: 80

