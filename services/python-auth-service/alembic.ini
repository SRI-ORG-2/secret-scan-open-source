[alembic]
script_location = migrations
prepend_sys_path = .

# Use the prod DB directly for migrations
# sqlalchemy.url = driver://user:pass@localhost/dbname
sqlalchemy.url = postgresql://shopflow_admin:Sup3rS3cr3t_PgPass!2024@prod-db.shopflow.internal:5432/shopflow

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
